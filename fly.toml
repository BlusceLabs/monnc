# Fly.io — one-click deploy (uses the repo's Dockerfile).
# After `fly launch` (or `fly deploy` with this file) the app listens on $PORT.
# Set a domain with `fly certs add monnc.example.com` and SITE_DOMAIN to enable HTTPS.

app = "monnc"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PROXY_ALLOW_EXTERNAL_TARGETS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
